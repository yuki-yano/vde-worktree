name: Cargo release validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate crates.io package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
        with:
          components: clippy, rustfmt

      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test all targets
        run: cargo test --locked --all-targets --all-features

      - name: Verify package contents and build
        run: |
          cargo package --locked --list | LC_ALL=C sort | diff -u .github/package-allowlist.txt -
          cargo package --locked

      - name: Verify packaged binaries
        run: |
          package_root="target/package/vde-worktree-$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          cargo install --path "$package_root" --locked --root "$RUNNER_TEMP/vde-worktree-install"
          "$RUNNER_TEMP/vde-worktree-install/bin/vw" --version
          "$RUNNER_TEMP/vde-worktree-install/bin/vde-worktree" --version
