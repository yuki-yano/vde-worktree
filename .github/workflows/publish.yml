name: Cargo release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate crates.io package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
        with:
          components: clippy, rustfmt

      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test all targets
        run: cargo test --locked --all-targets --all-features

      - name: Verify package contents and build
        run: |
          cargo package --locked --list | LC_ALL=C sort | diff -u .github/package-allowlist.txt -
          cargo package --locked

      - name: Verify packaged binaries
        run: |
          package_root="target/package/vde-worktree-$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          cargo install --path "$package_root" --locked --root "$RUNNER_TEMP/vde-worktree-install"
          "$RUNNER_TEMP/vde-worktree-install/bin/vw" --version
          "$RUNNER_TEMP/vde-worktree-install/bin/vde-worktree" --version

  publish:
    name: Publish to crates.io
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0

      - name: Verify tag matches package version
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "vde-worktree") | .version')"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
