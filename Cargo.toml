[package]
name = "vde-worktree"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
description = "Git worktree manager with safe defaults for humans and coding agents"
license = "MIT"
repository = "https://github.com/yuki-yano/vde-worktree"
readme = "README.md"
keywords = ["git", "worktree", "cli", "fzf", "vde"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE",
  "/README.md",
  "/README.ja.md",
  "/fixtures/rust-migration/*.json",
  "/src/**/*.rs",
  "/tests/**/*.rs",
  "/completions/zsh/_vw",
  "/completions/fish/vw.fish",
]

[lib]
name = "vde_worktree"
path = "src/lib.rs"

[[bin]]
name = "vw"
path = "src/bin/vw.rs"

[[bin]]
name = "vde-worktree"
path = "src/bin/vde-worktree.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.2", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.7"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = { version = "1.0.0-rc.1", default-features = false, features = ["deserialize"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.19"
terminal_size = "0.4.4"
tempfile = "3.23.0"
time = { version = "0.3.53", features = ["formatting", "macros", "parsing"] }
unicode-width = "0.2.2"
wait-timeout = "0.2.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["dir", "fs", "hostname", "process", "signal", "term"] }
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.10.0"

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
